<div class="kpi-card" style="border-top: 4px solid {color_borde};">
    <h4 style="margin:0 0 10px 0; color:#0F172A; font-size:1.05rem;">{nombre_cluster}</h4>
    <div style="font-size:0.86rem; color:#475569; line-height:1.6;">
        • <b>Volumen:</b> {volumen}<br>
        • <b>Hurtos Promedio/Año:</b> {hurtos_prom}<br>
        • <b>Recuperación Promedio:</b> {recup_prom}
    </div>
    <div style="margin-top:12px; padding:10px; background:#F8FAFC; border-radius:8px; font-size:0.8rem; color:#334155;">
        <b>Estrategia Policial:</b> {estrategia}
    </div>
</div>
