<div class="kpi-card" style="border: 1px solid {border_color}; background: {bg_color};">
    <span class="{pill_class}">{pill_text}</span>
    <h3 style="margin: 12px 0 6px 0; color: {title_color}; font-size: 1.3rem;">{title}</h3>
    <p style="margin:0; font-size: 0.85rem; color: #475569;">{subtitle}</p>
    <hr style="margin: 12px 0; border: none; border-top: 1px solid #E2E8F0;">
    <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
        <span style="color:#64748B; font-size:0.85rem;">Accuracy Test:</span>
        <b style="color:#0F172A;">{acc}</b>
    </div>
    <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
        <span style="color:#64748B; font-size:0.85rem;">Recall:</span>
        <b style="color:{recall_color};">{recall}</b>
    </div>
    <div style="display: flex; justify-content: space-between;">
        <span style="color:#64748B; font-size:0.85rem;">F1-Score:</span>
        <b style="color:#0F172A;">{f1}</b>
    </div>
    <p style="margin: 14px 0 0 0; font-size: 0.78rem; color: {note_color}; font-weight: 600;">
        {note}
    </p>
</div>
