<div class="kpi-card" style="border-left: 5px solid {color_borde}; background: {bg_color};">
    <div style="font-size:0.8rem; font-weight:700; color:{color_borde};">{tag}</div>
    <h4 style="margin:4px 0 6px 0; color:{title_color}; font-size:1.05rem;">{nombre}</h4>
    <div style="font-size:1.4rem; font-weight:800; color:{title_color};">{porcentaje}</div>
    <div style="font-size:0.8rem; color:{sub_color}; margin-top:4px;">{registros}</div>
    <hr style="margin:8px 0; border:none; border-top:1px solid #E2E8F0;">
    <div style="font-size:0.78rem; color:#475569;">Hurto prom: <b>{hurto_prom}</b></div>
    <div style="font-size:0.78rem; color:#475569;">Recuperación: <b>{recup_prom}</b></div>
</div>
